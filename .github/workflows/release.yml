name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit tested by the Tests workflow"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: pip install -e .

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Set version in the setuptools toml
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^version[[:space:]]*=[[:space:]]*\"[^\"]*\"/version = \"$version\"/" pyproject.toml

      - name: Build executable
        shell: bash
        run: |
          PyInstaller --onedir --windowed src/dbd_maps/map_overlay.py
          cp config.ini dist/map_overlay/config.ini
          cp -r local_maps dist/map_overlay/local_maps

      - name: Create archive
        shell: bash
        run: |
          cd dist
          7z a ../dbd-maps-windows.zip map_overlay

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dbd-maps-windows.zip \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
