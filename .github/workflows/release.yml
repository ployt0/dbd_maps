name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit tested by the Tests workflow"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: pip install -e .

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Set version in the setuptools toml
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^version[[:space:]]*=[[:space:]]*\"[^\"]*\"/version = \"$version\"/" pyproject.toml

      - name: Generate Windows version info
        run: python make_versiontxt.py

      - name: Build executable
        shell: bash
        run: |
          PyInstaller \
            --name dbd_maps \
            --icon=dbd_maps.ico \
            --onedir \
            --windowed \
            --version-file version.txt \
            --noconfirm \
            --exclude-module sqlite3 \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module lib2to3 \
            --exclude-module multiprocessing \
            --exclude-module test \
            --exclude-module doctest \
            --exclude-module bz2 \
            --exclude-module _bz2 \
            --exclude-module lzma \
            --exclude-module _lzma \
            --exclude-module decimal \
            --exclude-module fractions \
            --exclude-module ssl \
            --exclude-module _ssl \
            --exclude-module socket \
            --exclude-module http \
            --exclude-module email \
            --exclude-module urllib \
            --exclude-module xml \
            --exclude-module xmlrpc \
            --exclude-module html \
            --exclude-module ftplib \
            --exclude-module poplib \
            --exclude-module imaplib \
            --exclude-module smtplib \
            src/dbd_maps/map_overlay.py
          cp config.ini dist/dbd_maps/
          cp dbd_maps.ico dist/dbd_maps/
          cp -r local_maps dist/dbd_maps/local_maps

      - name: Create archive
        shell: bash
        run: |
          cd dist
          7z a ../dbd-maps-windows.zip dbd_maps

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dbd-maps-windows.zip \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
